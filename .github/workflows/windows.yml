name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pyinstaller pygame-ce numpy
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tron-windows
          path: dist/tron/   
